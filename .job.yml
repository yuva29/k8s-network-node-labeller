---
version: 2.0
builds:
  build-network-node-labeller:
    commands: ["sh", "-c", "cd /usr/src/github.com/ROCm/k8s-network-node-labeller && make build"]
    owners: ["email:Shiv.Tyagi@amd.com"]
    artifacts:
        - /k8s-network-node-labeller/build/network-node-labeller

  build-network-node-labeller-docker:
    commands: ["sh", "-c", "cd /usr/src/github.com/ROCm/k8s-network-node-labeller && \
                HOURLY_TAG_LABEL=$RELEASE IMAGE_TAG=latest make docker-build docker-save"]
    owners: ["email:Shiv.Tyagi@amd.com"]
    artifacts:
        - /k8s-network-node-labeller/build/docker/k8s-network-node-labeller-latest.tar.gz
  
  build-network-node-labeller-helm-chart:
    commands: ["sh", "-c", "cd /usr/src/github.com/ROCm/k8s-network-node-labeller && \
                export RELEASE=${RELEASE:-v0.0.1} && \
                tag_prefix=${RELEASE%-*} && \
                if [ \"$tag_prefix\" = \"main\" ]; then \
                  HELM_CHART_VERSION=v0.0.1-$RELEASE; \
                else \
                  HELM_CHART_VERSION=$RELEASE; \
                fi && \
                IMAGE_TAG=$RELEASE HELM_CHART_VERSION=$HELM_CHART_VERSION HELM_CHART_APP_VERSION=$RELEASE make helm"]
    owners: ["email:Shiv.Tyagi@amd.com"]
    artifacts:
        - /k8s-network-node-labeller/helm-charts-k8s/k8s-network-node-labeller-helm-k8s-v0.0.1.tgz

targets:
  unit-tests:
    commands: [ "/bin/sh", "-c", "cd /usr/src/github.com/ROCm/k8s-network-node-labeller && make test"]
    owners: ["email:Shiv.Tyagi@amd.com"]
    area:
    sub-area:
    feature:

  copyright-checks:
    commands: [ "/bin/sh", "-c", "cd /usr/src/github.com/ROCm/k8s-network-node-labeller && make copyrights"]
    owners: ["email:sajmera@amd.com"]
    area:
    sub-area:
    feature:

image:
  bind_dir: "/k8s-network-node-labeller"
  work_dir: "/k8s-network-node-labeller"

jobs:
  asset-build:
    labels: ["CI-Sanity-Build"]
